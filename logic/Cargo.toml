[package]
name = "pio_speed_encoder_logic"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-time = { version = "0.5.0" }
defmt = { version = "1.0.1", optional = true }
mutants = "0.0.3"
embassy-sync = "0.7.2"
embassy-futures = "0.1.2"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["test-util", "rt", "macros"] }
embassy-time = { version = "0.5.0", features = [ "mock-driver","generic-queue-8" ]}
critical-section = { version = "1.1", features = ["std"]}

[features]
defmt = ["embassy-time/defmt","dep:defmt"]
